<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1B3B2B" />
    <title>Koru — You're offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #fbf9f5;
        color: #1b3b2b;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }
      main { max-width: 420px; text-align: center; }
      img { width: 64px; height: 64px; border-radius: 18px; margin-bottom: 24px; }
      h1 { margin: 0 0 12px; font-size: 30px; letter-spacing: -0.04em; }
      p { margin: 0; color: #6d8176; line-height: 1.6; }
      button {
        margin-top: 28px;
        padding: 13px 22px;
        border: 0;
        border-radius: 12px;
        background: #1b3b2b;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/apple-touch-icon.png" alt="Koru" />
      <h1>A quiet moment offline</h1>
      <p>Reconnect to continue your journey with Koru. Your saved progress will be here when you’re back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
